# Прод-стек Aura: PostgreSQL + Python AI Service + C++-сервер.
#
# Секреты обязательны: compose откажется стартовать, если они не заданы в .env
# (шаблон — .env.example, генерация — `openssl rand -hex 32`).
# Наружу опубликован только порт сервера 9000 (за TLS-прокси, wss://);
# PostgreSQL и AI-сервис доступны лишь внутри сети compose.
# AURA_DEV_MODE здесь не задаётся и в проде задаваться не должен.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (openssl rand -hex 32)}
      # Пароли ролей приложения — их создаёт deploy/postgres/20-app-roles.sh
      AURA_DB_PASSWORD: ${AURA_DB_PASSWORD:?AURA_DB_PASSWORD is required (openssl rand -hex 32)}
      AURA_AI_DB_PASSWORD: ${AURA_AI_DB_PASSWORD:?AURA_AI_DB_PASSWORD is required (openssl rand -hex 32)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Только схема и роли. seed.sql (демо-аккаунты) в прод не монтируется.
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./deploy/postgres/20-app-roles.sh:/docker-entrypoint-initdb.d/20-app-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aura"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # ports не публикуются: доступ к БД — только из сети compose.
    # Для обслуживания: docker compose exec postgres psql -U postgres aura

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AURA_MEMORY_BACKEND: postgres
      # Отдельная роль aura_ai: только user_memory и users(id, email).
      AURA_DATABASE_URL: postgresql://aura_ai:${AURA_AI_DB_PASSWORD:?AURA_AI_DB_PASSWORD is required}@postgres/aura
      AURA_AI_TOKEN: ${AURA_AI_TOKEN:?AURA_AI_TOKEN is required (openssl rand -hex 32)}
      AURA_LLM_PROVIDER: ${AURA_LLM_PROVIDER:-mock}
      AURA_LLM_MODEL: ${AURA_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AURA_RAG_MODE: ${AURA_RAG_MODE:-auto}
      AURA_CORS_ORIGINS: http://server:9000
    healthcheck:
      # В python:3.12-slim нет curl — проверяем средствами самого Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    # ports не публикуются: AI-сервис — внутренний, к нему ходит только server.

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Роль aura_app: только DML, не суперпользователь.
      AURA_DATABASE_URL: postgresql://aura_app:${AURA_DB_PASSWORD:?AURA_DB_PASSWORD is required}@postgres/aura
      AURA_AI_URL: http://ai:8000
      AURA_AI_TOKEN: ${AURA_AI_TOKEN:?AURA_AI_TOKEN is required (openssl rand -hex 32)}
      AURA_JWT_SECRET: ${AURA_JWT_SECRET:?AURA_JWT_SECRET is required (openssl rand -hex 32)}
      AURA_2FA_KEY: ${AURA_2FA_KEY:?AURA_2FA_KEY is required (openssl rand -hex 32)}
      AURA_HOST: 0.0.0.0
      AURA_PORT: 9000
      AURA_MAX_CONNECTIONS: ${AURA_MAX_CONNECTIONS:-1024}
      AURA_MAX_LOGIN_ATTEMPTS: ${AURA_MAX_LOGIN_ATTEMPTS:-}
      AURA_LOGIN_WINDOW: ${AURA_LOGIN_WINDOW:-}
      # Почта: smtp — настоящая отправка; log — только запись в лог (без кодов).
      AURA_MAIL_DRIVER: ${AURA_MAIL_DRIVER:-log}
      AURA_SMTP_HOST: ${AURA_SMTP_HOST:-}
      AURA_SMTP_PORT: ${AURA_SMTP_PORT:-}
      AURA_SMTP_TLS: ${AURA_SMTP_TLS:-}
      AURA_SMTP_USER: ${AURA_SMTP_USER:-}
      AURA_SMTP_PASSWORD: ${AURA_SMTP_PASSWORD:-}
      AURA_SMTP_FROM: ${AURA_SMTP_FROM:-}
      AURA_PUSH_DRIVER: ${AURA_PUSH_DRIVER:-dev}
      AURA_PUSH_WEBHOOK_URL: ${AURA_PUSH_WEBHOOK_URL:-}
      AURA_GOOGLE_CLIENT_ID: ${AURA_GOOGLE_CLIENT_ID:-}
      AURA_GOOGLE_CLIENT_SECRET: ${AURA_GOOGLE_CLIENT_SECRET:-}
      AURA_LOG_LEVEL: ${AURA_LOG_LEVEL:-info}
    healthcheck:
      # Порт 9000 принимает соединения (в образе есть bash, curl — нет).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      # Публичная точка входа: ставьте TLS-прокси (wss://) перед ней.
      # Только локально за прокси на этой же машине: AURA_BIND=127.0.0.1
      - "${AURA_BIND:-0.0.0.0}:9000:9000"

volumes:
  pgdata:
