# Сборка Android-клиента Aura Agent (bot/android) — клиента Python-бэкенда bot/.
#
# Результат: Actions → «Build Aura Agent APK» → Artifacts → aura-agent-android-debug
# (app-debug.apk, debug-подпись — ставится на телефон напрямую).
# Адрес сервера и FCM задаются секретами репозитория (необязательно):
#   AURA_API_URL, AURA_FCM_API_KEY, AURA_FCM_APP_ID, AURA_FCM_PROJECT_ID, AURA_FCM_SENDER_ID.
# Без них APK собирается с адресом http://10.0.2.2:8080 (меняется на экране входа) и без FCM.
name: Build Aura Agent APK

on:
  push:
    branches: ["**"]
    paths:
      - "bot/android/**"
      - ".github/workflows/build-bot-android.yml"
  pull_request:
    paths:
      - "bot/android/**"
  workflow_dispatch:

jobs:
  apk:
    name: Gradle — тесты и app-debug.apk
    runs-on: ubuntu-latest
    permissions:
      contents: write   # публикация APK в ветку builds/bot-android
    defaults:
      run:
        working-directory: bot/android
    env:
      AURA_API_URL: ${{ secrets.AURA_API_URL }}
      AURA_FCM_API_KEY: ${{ secrets.AURA_FCM_API_KEY }}
      AURA_FCM_APP_ID: ${{ secrets.AURA_FCM_APP_ID }}
      AURA_FCM_PROJECT_ID: ${{ secrets.AURA_FCM_PROJECT_ID }}
      AURA_FCM_SENDER_ID: ${{ secrets.AURA_FCM_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # wrapper в репозитории не хранится (как и у android/) — ставим Gradle нужной версии
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Юнит-тесты (протокол клиента)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Сборка APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Артефакт — APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-agent-android-debug
          path: bot/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Как у android/: песочница не видит blob-хосты артефактов, поэтому APK
      # дублируется в ветку builds/bot-android (забирается обычным git fetch).
      - name: Публикация в ветку builds/bot-android
        if: success()
        working-directory: .
        run: |
          set -e
          mkdir pub && cp bot/android/app/build/outputs/apk/debug/app-debug.apk pub/AuraAgent-debug.apk
          cd pub
          git init -q -b builds/bot-android
          git config user.name aura-ci && git config user.email ci@aura.local
          git add -A && git commit -qm "bot-android ${{ github.sha }} [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/builds/bot-android

      - name: Отчёт тестов при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aura-agent-android-reports
          path: bot/android/app/build/reports/
