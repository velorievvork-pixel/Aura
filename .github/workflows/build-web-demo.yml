# Клиент Aura из web/ (React + Capacitor + Electron) — работает с настоящим
# сервером Aura по WebSocket. Собирает APK и установщик Windows.
#
# Адрес сервера вшивается при сборке из переменных репозитория
# (Settings → Secrets and variables → Actions → Variables):
#   AURA_SERVER_URL   — основной, wss://… (продакшн за TLS);
#   AURA_FALLBACK_URL — запасной, клиент переключается на него сам.
# Без них: Android-эмулятор → ws://10.0.2.2:9000, Windows → ws://127.0.0.1:9000;
# адрес всегда можно поменять в приложении («Адрес сервера» на экране входа).
#
# Результат: артефакты прогона, релиз «builds» и ветки builds/web-android,
# builds/web-windows (песочница разработки забирает файлы оттуда обычным git).
#
# Безопасность: сборка (npm ci/скрипты пакетов, Gradle) идёт с токеном только
# на чтение; публикация — отдельным job'ом с правом записи, только push в main.
name: Build web client

on:
  push:
    branches: ["**"]
    paths: ["web/**", ".github/workflows/build-web-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

env:
  VITE_AURA_SERVER_URL: ${{ vars.AURA_SERVER_URL }}
  VITE_AURA_FALLBACK_URL: ${{ vars.AURA_FALLBACK_URL }}

jobs:
  android:
    name: Веб-клиент — APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Сборка
        run: |
          npm ci
          npm test
          npm run build && npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: aura-web-android, path: web/android/app/build/outputs/apk/debug/*.apk }

  windows:
    name: Веб-клиент — Windows
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Сборка
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: aura-web-windows, path: web/release/*.exe }

  # Публикация: релиз «builds» и ветки builds/web-*. Только push в main;
  # код из репозитория здесь не исполняется — только скачанные артефакты.
  publish-android:
    name: Публикация APK (main)
    needs: android
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { name: aura-web-android, path: apk }

      # Страница Releases → «Сборки Aura»: файлы можно скачать прямо оттуда.
      - name: Публикация в релиз «builds» (APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          NOTES="Автоматические сборки из main. Aura-debug.apk и Aura-Setup.exe — нативные клиенты (Compose, Qt). Aura-web.apk и Aura-web-Setup.exe — веб-клиент (Capacitor, Electron). Всем нужен сервер Aura."
          gh release view builds -R "$R" >/dev/null 2>&1 || gh release create builds -R "$R" \
            --prerelease --target "$GITHUB_SHA" --title "Сборки Aura (последние)" --notes "$NOTES" || true
          gh release edit builds -R "$R" --notes "$NOTES" || true
          mkdir -p pubrel && cp apk/app-debug.apk pubrel/Aura-web.apk
          gh release upload builds pubrel/Aura-web.apk -R "$R" --clobber
          gh release delete-asset builds Aura-demo.apk -R "$R" -y || true

      - name: Публикация в ветку builds/web-android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir pub && cp apk/app-debug.apk pub/Aura-web.apk
          cd pub && git init -q -b builds/web-android
          git config user.name aura-ci && git config user.email ci@aura.local
          git add -A && git commit -qm "web apk ${{ github.sha }} [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/builds/web-android

  publish-windows:
    name: Публикация установщика (main)
    needs: windows
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { name: aura-web-windows, path: exe }

      # Страница Releases → «Сборки Aura»: файлы можно скачать прямо оттуда.
      - name: Публикация в релиз «builds» (Windows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          mkdir -p pubrel && for f in exe/*.exe; do cp "$f" pubrel/Aura-web-Setup.exe; break; done
          gh release view builds -R "$R" >/dev/null 2>&1 || gh release create builds -R "$R" \
            --prerelease --target "$GITHUB_SHA" --title "Сборки Aura (последние)" \
            --notes "Автоматические сборки из main. Aura-debug.apk и Aura-Setup.exe — нативные клиенты (Compose, Qt). Aura-web.apk и Aura-web-Setup.exe — веб-клиент (Capacitor, Electron). Всем нужен сервер Aura." || true
          gh release upload builds pubrel/Aura-web-Setup.exe -R "$R" --clobber
          gh release delete-asset builds Aura-demo-Setup.exe -R "$R" -y || true

      - name: Публикация в ветку builds/web-windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir pub
          for f in exe/*.exe; do cp "$f" pub/Aura-web-Setup.exe; break; done
          cd pub
          for f in *; do
            if [ "$(wc -c < "$f")" -gt 94000000 ]; then split -b 90m -d "$f" "$f.part"; rm "$f"; fi
          done
          git init -q -b builds/web-windows
          git config user.name aura-ci && git config user.email ci@aura.local
          git add -A && git commit -qm "web windows ${{ github.sha }} [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/builds/web-windows
