[project]
name = "aura-bot"
version = "0.1.0"
description = "Aura — личный ИИ-агент: Telegram-бот + HTTP API (один бэкенд)"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aura_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
